services:
  postgres:
    image: postgres:16
    container_name: paddockar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paddockar
      POSTGRES_USER: paddockar
      POSTGRES_PASSWORD: paddockar_pass
    ports:
      - "5433:5432"
    volumes:
      - paddockar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paddockar -d paddockar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  paddockar_postgres_data:
