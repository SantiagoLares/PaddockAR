services:
  mysql:
    image: mysql:8.4
    container_name: paddockar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: paddockar_root
      MYSQL_DATABASE: paddockar
      MYSQL_USER: paddockar
      MYSQL_PASSWORD: paddockar_pass
    ports:
      - "3307:3306"
    volumes:
      - paddockar_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "paddockar", "-ppaddockar_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  paddockar_mysql_data:
