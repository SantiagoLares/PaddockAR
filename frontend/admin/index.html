<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaddockAR Admin | Login</title>

  <link rel="stylesheet" href="../assets/css/base.css?v=20260519" />
  <link rel="stylesheet" href="../assets/css/admin.css?v=202606admin" />
</head>

<body class="admin-login-page">
  <main class="admin-login-shell">
    <section class="admin-login-card">
      <a class="admin-login-logo" href="../index.html">
        PADDOCK<span>AR</span>
      </a>

      <div class="admin-login-copy">
        <p>Panel de control</p>
        <h1>Acceso admin</h1>
        <span>Cargá eventos, sesiones y fines de semana del calendario público.</span>
      </div>

      <div class="admin-login-form">
        <label>
          <span>Usuario</span>
          <input id="username" autocomplete="username" />
        </label>

        <label>
          <span>Contraseña</span>
          <input id="password" type="password" autocomplete="current-password" />
        </label>

        <button id="loginButton" type="button">Ingresar</button>
      </div>

      <div id="state" class="admin-login-state">Login requerido</div>
      <div id="message"></div>
    </section>
  </main>

 <script src="../assets/js/common.js?v=20260506"></script>
<script src="../assets/js/admin-auth.js?v=20260625"></script>
<script src="../assets/js/admin-login.js?v=20260626"></script>
</body>
</html>
